source_plan:
  path: "docs/superpowers/plans/2026-11-04-wayland-scan-popup.md"
  sha256: "69bf985dcf4ba8ce3ea0c239a4eee60c47303355a57ccdac8125880e6351e769"
  commit_oid: "221f68946311e1cda6e520ffb55a32e1a12c0966"
schema_version: 1
derivation_notes:
  - "Task metadata and writable ownership come from Implementer tier, Lane, Files Create/Modify entries and Interfaces. Lane owns is the deduplicated union of all task owns; Test entries are read dependencies, not writable ownership."
  - "Existing Qt, TestSupport, Config, backend and widget APIs are pinned repository baseline prerequisites. Task consumes below records only interfaces produced by this eight-task plan; no synthetic producer tasks are added."
  - "All eight tasks share the implementation lane in source-plan order, with contiguous sequences 1 through 8. The seven same-lane predecessor edges transitively serialize every shared writable file and producer/consumer handoff; no additional edges are needed."
  - "The source plan is pinned by path, SHA-256 of its exact bytes, and the commit that added them. Lane creation re-checks the committed bytes against source_plan.sha256 before any worktree is created."
  - "All validation cwd values are repository-root relative. env argv supplies platform/wrapper settings; GD_TEST_WRAPPER=./scripts/test-wrapper.sh resolves from cwd without shell expansion. Build-tree resources serialize validation against shared output trees."
  - "Validation vectors are executable configure/build/suite/wrapper/live checks. The source plan additionally requires its inline disposable-copy mutation/negative-package checks and manual evidence; those plan steps remain mandatory and are not replaced by these vectors."
